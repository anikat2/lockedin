<!DOCTYPE html>
<html>
  <head>
    <title>Focus Guardian</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="container">
      <h1>Focus Guardian</h1>
      
      <div id="timer-display" class="timer">25:00</div>
      
      <div id="status" class="status">Ready to focus</div>
      
      <div class="controls">
        <button id="start-work" class="btn btn-primary">Start Work (25min)</button>
        <button id="start-short-break" class="btn btn-secondary">Short Break (5min)</button>
        <button id="start-long-break" class="btn btn-secondary">Long Break (15min)</button>
        <button id="stop" class="btn btn-danger" disabled>Stop</button>
      </div>
      
      <div class="custom-timer">
        <label>Custom Duration (minutes):</label>
        <input type="number" id="custom-duration" min="1" max="120" value="25">
        <button id="start-custom" class="btn btn-secondary">Start Custom</button>
      </div>
      
      <div class="custom-timer">
        <label>Camera Detection:</label>
        <button id="toggle-camera" class="btn btn-secondary">Enable Camera</button>
        <p style="font-size: 11px; color: #666; margin-top: 5px;">
          Camera will appear in the current tab
        </p>
      </div>
      
      <div class="stats">
        <div>Pomodoros Today: <span id="pomodoro-count">0</span></div>
        <div>Ad Blocking: <span class="active">Active</span></div>
      </div>
    </div>
    
    <script src="popup.js"></script>
  </body>
</html>
